name: Mise à jour des données MotoGP

on:
  schedule:
    # Tous les jours à 03:00 UTC : couvre les courses hors Europe (Asie, Amériques)
    - cron: '0 3 * * *'
    # Dimanche 18:00 UTC : mise à jour rapide après les GP européens
    - cron: '0 18 * * 0'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Récupérer les classements et le calendrier
        run: bash scripts/update-data.sh

      - name: Mettre à jour les photos des pilotes
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/rider-images.py

      - name: Publier les modifications
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json img/riders
          # meta.json change à chaque exécution : on ne commite que si les données ont bougé
          if git diff --staged --quiet -- ':!data/meta.json'; then
            echo "Aucun changement dans les classements ni le calendrier"
            git reset -q
            exit 0
          fi
          git commit -m "bot: mise à jour des classements et du calendrier"
          git push
