name: Mise a jour automatique des classements

on:
  schedule:
    - cron: '00 16 * * 1'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Télécharger les classements MotoGP, Moto2 et Moto3
        run: |
          mkdir -p data
          curl -s "https://api.motogp.pulselive.com/motogp/v1/results/standings?seasonYear=2026&categoryUuid=e8c110ad-64aa-4e8e-8a86-f2f152f6a942" > data/motogp.json
          curl -s "https://api.motogp.pulselive.com/motogp/v1/results/standings?seasonYear=2026&categoryUuid=549640b8-fd9c-4245-acfd-60e4bc38b25c" > data/moto2.json
          curl -s "https://api.motogp.pulselive.com/motogp/v1/results/standings?seasonYear=2026&categoryUuid=954f7e65-2ef2-4423-b949-4961cc603e45" > data/moto3.json

      - name: Publier les modifications
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: mise à jour automatique des classements" && git push)
